[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsa-tester"
version = "0.1.0"
description = "Local DSA practice web application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=1.50,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
dsa-tester = "dsa_tester.server:main"

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools]
packages = ["dsa_tester"]
package-dir = { dsa_tester = "." }
